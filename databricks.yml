bundle:
  name: cdp_realtime_segmentation

variables:
  catalog:
    default: main
  schema:
    default: cdp_rt_sim
  volume:
    default: cdp_rt_volume
  lakebase_endpoint:
    default: projects/REPLACE_ME/branches/production/endpoints/primary
  lakebase_database:
    default: databricks_postgres
  eventhub_bootstrap:
    default: REPLACE_ME.servicebus.windows.net:9093
  eventhub_name:
    default: tealium-events
  eventhub_secret_scope:
    default: cdp-rt
  eventhub_secret_key:
    default: eventhub-connection-string
  source_event_table_name:
    default: ""
  source_read_change_feed:
    default: "false"
  source_cdf_starting_version:
    default: ""
  source_profile_id_col:
    default: profile_id
  source_event_id_col:
    default: event_id
  source_event_ts_col:
    default: event_ts
  source_changed_properties_col:
    default: changed_properties
  profile_table_name:
    default: profile_attributes_delta
  profile_id_col:
    default: profile_id
  profile_accounts_col:
    default: accounts
  account_table_name:
    default: account_attributes_delta
  account_profile_id_col:
    default: profile_id
  account_id_col:
    default: account_group_id
  segment_definitions_table_name:
    default: segment_definitions_delta
  attribute_mapping_table_name:
    default: segment_attribute_mapping

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://REPLACE_ME.azuredatabricks.net
