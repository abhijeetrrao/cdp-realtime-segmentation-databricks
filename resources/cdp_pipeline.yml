resources:
  pipelines:
    cdp_realtime_segmentation_pipeline:
      name: "[${bundle.target}] CDP realtime segmentation SDP"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: true
      channel: PREVIEW
      development: true
      libraries:
        - glob:
            include: ../src/pipelines/realtime/**
      environment:
        dependencies:
          - --editable ${workspace.file_path}
          - databricks-sdk>=0.40.0
      configuration:
        spark.sql.shuffle.partitions: "auto"
        bundle_file_path: ${workspace.file_path}
        lakebase_endpoint: ${var.lakebase_endpoint}
        lakebase_database: ${var.lakebase_database}
        eventhub_bootstrap: ${var.eventhub_bootstrap}
        eventhub_name: ${var.eventhub_name}
        eventhub_secret_scope: ${var.eventhub_secret_scope}
        eventhub_secret_key: ${var.eventhub_secret_key}
        source_event_table_name: ${var.source_event_table_name}
        source_profile_id_col: ${var.source_profile_id_col}
        source_event_id_col: ${var.source_event_id_col}
        source_event_ts_col: ${var.source_event_ts_col}
        source_changed_properties_col: ${var.source_changed_properties_col}
        profile_table_name: ${var.profile_table_name}
        profile_id_col: ${var.profile_id_col}
        profile_accounts_col: ${var.profile_accounts_col}
        account_table_name: ${var.account_table_name}
        account_profile_id_col: ${var.account_profile_id_col}
        account_id_col: ${var.account_id_col}
        segment_definitions_table_name: ${var.segment_definitions_table_name}
        attribute_mapping_table_name: ${var.attribute_mapping_table_name}
        cdp_schema: "cdp_rt"
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"
